/* Repeat English: all study state stays in memory. No accounts or persistent storage. */
(() => {
  'use strict';

  function shuffle(items, random = Math.random) {
    const result = [...items];
    for (let i = result.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }
  function chooseSet(pool, count, previousIds = []) {
    const previous = new Set(previousIds);
    return [...shuffle(pool.filter(q => !previous.has(q.id))), ...shuffle(pool.filter(q => previous.has(q.id)))].slice(0, count);
  }
  function completedSentence(question) {
    return question.sentence.replace('___', question.options[question.answer]);
  }
  function reviewQuestions(entries, results) {
    return entries.filter((entry, i) => results[i] && (!results[i].correct || results[i].marked)).map(entry => entry.question);
  }
  window.RepeatCore = { shuffle, chooseSet, completedSentence, reviewQuestions };

  const root = document.getElementById('main');
  if (!root) return;
  const grammar = window.GRAMMAR_QUESTIONS || [];
  const listening = window.LISTENING_QUESTIONS || [];
  if (!grammar.length || !listening.length) {
    root.innerHTML = '<section class="loading-error"><h1>問題データを読み込めませんでした</h1><p>ページを再読み込みしてください。ファイルを移動した場合は、index.htmlと同じフォルダーにgrammar.js、listening.js、app.js、styles.cssを置いてください。</p><button class="button" id="reload-page">再読み込み</button></section>';
    document.getElementById('reload-page').onclick = () => location.reload();
    return;
  }

  const state = {
    page: 'home', mode: 'grammar', category: 'すべて', count: 10,
    entries: [], results: [], index: 0, reveal: true, exitPrompt: false,
    reviewRound: false, speed: 1, voiceURI: '', playing: false, speechToken: 0,
    utterance: null, lastIds: { grammar: [], listening: [] }, playedIds: new Set()
  };

  const icons = {
    arrow: '<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
    back: '<svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 12H5m6-6-6 6 6 6"/></svg>',
    book: '<svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1Zm0 0v15"/><path d="M6 8h3m-3 4h3m6-4h3m-3 4h3"/></svg>',
    headphones: '<svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 14v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="2"/><rect x="17" y="12" width="4" height="8" rx="2"/></svg>',
    play: '<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="m8 4 13 8-13 8z"/></svg>',
    speaker: '<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 4 6 8H2v8h4l5 4V4Zm4 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg>',
    stop: '<svg aria-hidden="true" width="25" height="25" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>'
  };

  const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const poolForMode = () => state.mode === 'grammar' ? grammar : listening;
  const modeTitle = () => state.mode === 'grammar' ? '文法・頻出表現' : '短文リスニング';
  const announce = message => { document.getElementById('announcer').textContent = message; };
  const moveTop = () => { window.scrollTo({ top: 0, behavior: 'instant' }); root.focus({ preventScroll: true }); };
  const canSpeak = () => 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const noveltyVoice = /^(Bad News|Good News|Bahh|Boing|Bubbles|Cellos|Zarvox|Trinoids|Whisper|Bells|Pipe Organ|Jester|Wobble|Hysterical|ささやき声|オルガン|スーパースター|トリノイド|ベル|道化|震え)$/i;
  const englishVoices = () => canSpeak() ? window.speechSynthesis.getVoices().filter(v => /^en(?:-|_|$)/i.test(v.lang) && !noveltyVoice.test(v.name)) : [];

  function stopSpeech() {
    state.speechToken++;
    if (canSpeak()) window.speechSynthesis.cancel();
    state.playing = false;
    state.utterance = null;
    updateAudioUI();
  }

  function updateAudioUI(message) {
    document.querySelectorAll('[data-audio-main]').forEach(button => {
      button.innerHTML = state.playing ? icons.stop : icons.play;
      button.setAttribute('aria-label', state.playing ? '音声を停止' : '英文を再生');
    });
    if (message !== undefined) document.querySelectorAll('[data-audio-status]').forEach(node => { node.textContent = message; });
  }

  function speak(text) {
    if (!canSpeak()) {
      updateAudioUI('このブラウザは読み上げに対応していません。SafariやChromeでお試しください。');
      announce('音声を再生できません。英文で学ぶ、を開くと文字で練習できます。');
      return;
    }
    stopSpeech();
    const token = state.speechToken;
    const utterance = new SpeechSynthesisUtterance(text);
    const voices = englishVoices();
    const voice = voices.find(v => v.voiceURI === state.voiceURI)
      || voices.find(v => /^(Samantha|Google US English|Microsoft (?:Aria|Jenny|Ava).*)$/i.test(v.name))
      || voices.find(v => v.lang === 'en-US' && v.localService)
      || voices.find(v => v.lang === 'en-US') || voices[0];
    if (voice) utterance.voice = voice;
    utterance.lang = voice ? voice.lang : 'en-US';
    utterance.rate = state.speed;
    state.utterance = utterance;
    state.playing = true;
    updateAudioUI('再生しています…');
    utterance.onstart = () => { if (token === state.speechToken) updateAudioUI('聞いて、意味を思い浮かべましょう。'); };
    utterance.onend = () => {
      if (token !== state.speechToken) return;
      state.playing = false;
      state.utterance = null;
      updateAudioUI('もう一度聞くには、再生ボタンをタップ。');
    };
    utterance.onerror = event => {
      if (token !== state.speechToken) return;
      state.playing = false;
      state.utterance = null;
      updateAudioUI(event.error === 'canceled' || event.error === 'interrupted' ? '再生を停止しました。' : '音声を再生できませんでした。端末の英語音声と音量を確認し、もう一度お試しください。');
    };
    window.speechSynthesis.speak(utterance);
  }

  function audioSettings() {
    return `<details class="audio-settings"><summary>音声の設定・再生できないとき</summary>
      <div class="audio-fields"><label class="select-label">読む速さ<select data-setting="speed" aria-label="読む速さ">${[.75,1,1.1].map(rate => `<option value="${rate}" ${state.speed === rate ? 'selected' : ''}>${rate}倍${rate === 1 ? '（標準）' : ''}</option>`).join('')}</select></label>
      <label class="select-label">英語の音声<select data-setting="voice" aria-label="英語の音声">${voiceOptions()}</select></label></div>
      <p class="audio-note">端末の英語読み上げ音声を使います。声質は端末によって異なります。音が出ないときは音量・イヤホンと端末の英語音声を確認してください。自動再生はしません。</p></details>`;
  }

  function voiceOptions() {
    return '<option value="">おまかせ（英語）</option>' + englishVoices().map(v => `<option value="${escape(v.voiceURI)}" ${v.voiceURI === state.voiceURI ? 'selected' : ''}>${escape(v.name)} · ${escape(v.lang)}</option>`).join('');
  }

  function renderHome() {
    state.page = 'home';
    stopSpeech();
    root.innerHTML = `<section class="hero"><div><div class="eyebrow">YOUR DAILY ENGLISH LOOP</div><h1>短く、何度も。<span>英語を自分のものに。</span></h1><p class="hero-copy">1セット5問から。文法と表現を、目と耳でくり返そう。<br>少しずつでも、英語にふれる時間を。</p></div>
      <div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="loop-card"><span class="loop-symbol">↻</span><small>ONE MORE TIME</small></div><div class="art-tag">a little, every day.</div></div></section>
      <section aria-labelledby="choose-title"><div class="section-top"><h2 id="choose-title">今日は、どちらから？</h2><span>自分のペースで、ひと回り。</span></div><div class="mode-grid">
      <article class="mode-card"><div class="mode-top"><div class="mode-icon">${icons.book}</div><span class="mode-number">01 / READ & LEARN</span></div><h3>文法・頻出表現</h3><p>4択で解いて、理由を知る。<br>完成した英文は、音声でも確かめよう。</p><div class="mode-tags"><span class="tag">Part 5形式</span><span class="tag">日本語解説</span><span class="tag">${grammar.length}問</span></div><button class="button" data-action="setup" data-mode="grammar">文法・表現を練習する ${icons.arrow}</button></article>
      <article class="mode-card listening"><div class="mode-top"><div class="mode-icon">${icons.headphones}</div><span class="mode-number">02 / LISTEN & REPEAT</span></div><h3>短文リスニング</h3><p>まず聞く。意味をつかむ。もう一度聞く。<br>短い英文で、音と意味をつなげよう。</p><div class="mode-tags"><span class="tag">1〜2文の音声</span><span class="tag">区切って再生</span><span class="tag">${listening.length}問</span></div><button class="button" data-action="setup" data-mode="listening">聞く練習をする ${icons.arrow}</button></article>
      </div></section><section class="habit-strip" aria-label="反復学習の進め方"><div class="habit-step"><span class="step-num">01</span><div><strong>短いセットで始める</strong><p>5問だけでも、英語にふれる。</p></div></div><div class="habit-step"><span class="step-num">02</span><div><strong>理由と音を確かめる</strong><p>分かった英文を、耳にもなじませる。</p></div></div><div class="habit-step"><span class="step-num">03</span><div><strong>もう一度、ひと回り</strong><p>同じ問題も、別の問題も。</p></div></div></section>`;
  }

  function renderSetup() {
    state.page = 'setup';
    const pool = poolForMode();
    const categories = ['すべて', ...new Set(pool.map(q => q.category))];
    const available = pool.filter(q => state.category === 'すべて' || q.category === state.category).length;
    root.innerHTML = `<section class="setup"><button class="breadcrumb" data-action="home">${icons.back} 学習メニュー</button>
      <div class="page-heading"><div class="eyebrow">${state.mode === 'grammar' ? 'READ & LEARN' : 'LISTEN & REPEAT'}</div><h1>${modeTitle()}</h1><p>${state.mode === 'grammar' ? 'テーマを選んで、分かるまで何度でも。' : '英文を見ずに聞いてから、意味を確かめよう。'}</p></div>
      <div class="setup-panel"><p class="field-label">練習するテーマ</p><div class="category-grid">${categories.map(category => `<button class="category-button ${category === state.category ? 'selected' : ''}" data-action="category" data-category="${escape(category)}" aria-pressed="${category === state.category}"><span>${escape(category)}</span><small>${category === 'すべて' ? pool.length : pool.filter(q => q.category === category).length}問</small></button>`).join('')}</div>
      <p class="field-label">1セットの問題数</p><div class="count-controls">${[5,10,20].map(count => `<button class="count-button ${count === state.count ? 'selected' : ''}" data-action="count" data-count="${count}" aria-pressed="${count === state.count}" ${count > available ? 'disabled' : ''}>${count}問</button>`).join('')}</div>
      ${state.mode === 'listening' ? audioSettings() : ''}
      <button class="button start-button" data-action="start">${Math.min(state.count, available)}問のセットを始める ${icons.arrow}</button><p class="review-hint">問題・選択肢の順番は毎回変わります。何周でもどうぞ。</p></div></section>`;
  }

  function startSession(questions, reviewRound = false) {
    stopSpeech();
    const pool = poolForMode().filter(q => state.category === 'すべて' || q.category === state.category);
    const selected = questions || chooseSet(pool, Math.min(state.count, pool.length), state.lastIds[state.mode]);
    if (!selected.length) return;
    state.entries = shuffle(selected).map(question => ({ question, choices: shuffle(question.options.map((text, originalIndex) => ({ text, originalIndex }))) }));
    state.results = [];
    state.index = 0;
    state.reveal = true;
    state.exitPrompt = false;
    state.reviewRound = reviewRound;
    state.playedIds = new Set();
    state.lastIds[state.mode] = selected.map(q => q.id);
    state.page = 'quiz';
    renderQuiz();
    moveTop();
  }

  function sentenceHTML(question, answered) {
    const [before, after] = question.sentence.split('___');
    return `${escape(before)}${answered ? `<span class="filled-word">${escape(question.options[question.answer])}</span>` : '<span class="blank" aria-label="空欄">&nbsp;</span>'}${escape(after)}`;
  }

  function renderQuiz() {
    state.page = 'quiz';
    const entry = state.entries[state.index];
    const question = entry.question;
    const result = state.results[state.index];
    const answered = Boolean(result);
    const isListening = state.mode === 'listening';
    root.innerHTML = `<section class="quiz-wrap"><div class="quiz-nav"><button class="breadcrumb" data-action="exit">${icons.back} メニューへ</button><span class="quiz-count"><strong>${state.index + 1}</strong> / ${state.entries.length}</span></div>
      <div class="progress-track" role="progressbar" aria-label="このセットの進み具合" aria-valuemin="0" aria-valuemax="${state.entries.length}" aria-valuenow="${state.index + (answered ? 1 : 0)}"><div class="progress-fill" style="width:${(state.index + (answered ? 1 : 0)) / state.entries.length * 100}%"></div></div>
      ${state.exitPrompt ? '<div class="exit-panel" role="alert"><p>このセットを終了してメニューに戻りますか？ 今回の解答は保存されません。</p><div><button class="button secondary" data-action="cancel-exit">練習を続ける</button><button class="button" data-action="home">メニューに戻る</button></div></div>' : ''}
      <div class="quiz-meta"><span class="tag">${escape(question.category)}</span><span class="question-kind">${state.reviewRound ? 'もう一度のセット' : isListening ? 'LISTEN & REPEAT' : 'PART 5 PRACTICE'}</span></div>
      <article class="question-card" aria-label="問題 ${state.index + 1}">
      ${isListening ? `<div class="listen-stage"><p class="listen-prompt">英文を見ずに、聞いてみよう。</p><button class="play-main" data-action="play-main" data-audio-main aria-label="英文を再生">${icons.play}</button><p class="listen-status" data-audio-status role="status">再生ボタンをタップして始めます。</p><div class="speed-row" aria-label="再生速度">${[.75,1,1.1].map(rate => `<button class="${state.speed === rate ? 'selected' : ''}" data-action="speed" data-rate="${rate}" aria-pressed="${state.speed === rate}">${rate}倍</button>`).join('')}</div></div><h1 class="listening-question">${escape(question.prompt)}</h1>` : `<h1 class="sr-only">空欄に入る最も適切なものを選んでください</h1><p class="english-sentence" lang="en">${sentenceHTML(question, answered)}</p>`}
      <div class="answer-list ${isListening ? 'listening-options' : ''}" aria-label="選択肢">${entry.choices.map((choice, i) => {
        const correct = answered && choice.originalIndex === question.answer;
        const wrong = answered && result.choice === choice.originalIndex && !correct;
        return `<button class="answer-button ${correct ? 'correct' : ''} ${wrong ? 'wrong' : ''}" data-action="answer" data-choice="${choice.originalIndex}" ${answered ? 'disabled' : ''}><span class="answer-letter" aria-hidden="true">${String.fromCharCode(65 + i)}</span><span ${isListening ? '' : 'lang="en"'}>${escape(choice.text)}</span>${correct || wrong ? `<span class="answer-result-icon" aria-label="${correct ? '正解' : 'あなたの解答・不正解'}">${correct ? '✓' : '×'}</span>` : ''}</button>`;
      }).join('')}</div>
      ${answered ? renderFeedback(question, result, isListening) : `<p class="question-help">${isListening ? '何度聞いてもOK。分からないときも、まず選んでみよう。' : '空欄の前後を見て、最も適切なものを選ぼう。'}</p>${isListening ? `<details class="text-fallback"><summary>音が出ないときは、英文で学ぶ</summary><p lang="en">${escape(question.text)}</p><small>端末の英語音声・音量・イヤホンも確認してください。</small></details>` : ''}`}
      ${isListening ? '' : answered ? audioSettings() : ''}</article>
      ${answered ? `<div class="next-row"><label class="mark-button"><input type="checkbox" data-setting="mark" ${result.marked ? 'checked' : ''}> ${isListening ? 'もう一度聞きたい' : '正解したけれど、まだ迷う'}</label><button class="button" data-action="next">${state.index + 1 === state.entries.length ? 'このセットの結果へ' : '次の問題へ'} ${icons.arrow}</button></div><p class="review-hint">間違えた問題とチェックした問題は、セットの最後に解き直せます。</p>` : ''}</section>`;
    if (state.playing) updateAudioUI();
  }

  function renderFeedback(question, result, isListening) {
    const correctOption = state.entries[state.index].choices.findIndex(c => c.originalIndex === question.answer);
    return `<div class="answer-feedback ${result.correct ? '' : 'incorrect'}">${result.correct ? '✓ 正解です' : `↻ もう一度で、覚えよう。正解は ${String.fromCharCode(65 + correctOption)}`}</div>
      ${isListening ? `<section class="transcript"><div class="transcript-controls"><h3>英文と意味を確かめる</h3><button class="small-button" data-action="reveal">${state.reveal ? '英文を隠す' : '英文を表示'}</button></div><div id="transcript-text" ${state.reveal ? '' : 'hidden'}><p class="english-sentence" lang="en">${escape(question.text)}</p><p class="translation">${escape(question.translation)}</p><div class="chunk-list">${question.chunks.map((chunk, i) => `<button class="chunk-button" data-action="chunk" data-chunk="${i}" aria-label="${escape(chunk.en)} を再生"><span><span lang="en">${escape(chunk.en)}</span><small>${escape(chunk.ja)}</small></span>${icons.speaker}</button>`).join('')}</div><p class="tip">${escape(question.tip)}</p></div></section>` : `<div class="explanation"><h3>ここを見ると解ける</h3><p>${escape(question.explanation)}</p><h3>完成した英文の意味</h3><p class="translation">${escape(question.translation)}</p><details><summary>ほかの選択肢が合わない理由</summary><ul class="distractor-list">${state.entries[state.index].choices.map(choice => `<li><strong lang="en">${escape(choice.text)}</strong> — ${escape(question.distractors[choice.originalIndex])}</li>`).join('')}</ul></details></div>`}
      <div class="phrase-card" ${isListening && !state.reveal ? 'hidden' : ''} id="phrase-card"><strong lang="en">${escape(question.phrase)}</strong><span>${escape(question.phraseMeaning)}</span></div>
      <div class="post-answer-actions"><button class="button secondary" data-action="speak-sentence">${icons.speaker} ${isListening ? '全文をもう一度聞く' : '完成した英文を聞く'}</button>${isListening ? '' : '<button class="button secondary" data-action="repeat-question">この問題をもう一度</button>'}<button class="button ghost" data-action="stop-speech">停止</button></div>
      ${isListening ? '' : '<p class="inline-status" data-audio-status role="status"></p>'}`;
  }

  function answer(choice) {
    if (state.results[state.index]) return;
    const question = state.entries[state.index].question;
    if (!Number.isInteger(choice) || !question.options[choice]) return;
    stopSpeech();
    state.results[state.index] = { choice, correct: choice === question.answer, marked: false };
    state.reveal = true;
    renderQuiz();
    announce(choice === question.answer ? '正解です。解説を確認して次の問題へ進めます。' : '正解と解説を確認しましょう。');
    document.querySelector('.answer-feedback').scrollIntoView({ block: 'nearest', behavior: 'instant' });
  }

  function renderResult() {
    state.page = 'result';
    stopSpeech();
    const correctCount = state.results.filter(r => r.correct).length;
    const review = reviewQuestions(state.entries, state.results);
    root.innerHTML = `<section class="result"><div class="result-symbol" aria-hidden="true">↻</div><div class="eyebrow" style="margin-top:20px">ONE LOOP COMPLETE</div><h1>ひと回り、おつかれさま。</h1><p>くり返した分だけ、英語にふれた時間になる。</p>
      <div class="result-stats"><div class="result-stat"><strong>${correctCount}<span style="font-size:14px;color:var(--muted)"> / ${state.entries.length}</span></strong><small>今回の正解</small></div><div class="result-stat"><strong>${review.length}</strong><small>もう一度の問題</small></div></div>
      <div class="result-actions">${review.length ? `<button class="button" data-action="review">↻ 間違い・迷った問題をもう一度（${review.length}問）</button>` : ''}<button class="button ${review.length ? 'secondary' : ''}" data-action="repeat-set">↻ 同じセットをもう一周</button><button class="button secondary" data-action="new-set">別の問題で、もう一周 ${icons.arrow}</button><button class="button soft" data-action="switch-mode">${state.mode === 'grammar' ? icons.headphones + ' 聞く練習へ' : icons.book + ' 文法・表現の練習へ'}</button></div>
      <p class="result-note">この結果はページを閉じると消えます。自分のペースで、何周でも。</p>
      <div class="recap-list"><h2>今回ふれた表現</h2>${state.entries.map((entry, i) => `<div class="recap-item ${!state.results[i].correct || state.results[i].marked ? 'retry' : ''}"><span class="recap-status" aria-label="${state.results[i].correct ? '正解' : '不正解'}">${state.results[i].correct ? '✓' : '↻'}</span><div><strong lang="en">${escape(entry.question.phrase)}</strong><small>${escape(entry.question.phraseMeaning)}</small></div><button data-action="recap-audio" data-index="${i}" aria-label="${escape(entry.question.phrase)} の例文を再生">${icons.speaker}</button></div>`).join('')}</div><p class="inline-status" data-audio-status role="status"></p><button class="home-bottom-link" data-action="home">学習メニューに戻る</button></section>`;
    moveTop();
  }

  root.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled) return;
    const action = button.dataset.action;
    if (action === 'setup') {
      state.mode = button.dataset.mode;
      state.category = 'すべて';
      renderSetup(); moveTop();
    } else if (action === 'home') {
      state.entries = []; state.results = []; state.exitPrompt = false;
      renderHome(); moveTop();
    } else if (action === 'category') {
      state.category = button.dataset.category;
      const available = poolForMode().filter(q => state.category === 'すべて' || q.category === state.category).length;
      if (state.count > available) state.count = available >= 10 ? 10 : 5;
      renderSetup();
    } else if (action === 'count') {
      state.count = Number(button.dataset.count); renderSetup();
    } else if (action === 'start' || action === 'new-set') {
      startSession();
    } else if (action === 'answer') {
      answer(Number(button.dataset.choice));
    } else if (action === 'next') {
      if (!state.results[state.index]) return;
      stopSpeech();
      if (state.index + 1 === state.entries.length) renderResult();
      else { state.index++; state.reveal = true; renderQuiz(); moveTop(); }
    } else if (action === 'exit') {
      stopSpeech(); state.exitPrompt = true; renderQuiz();
      document.querySelector('.exit-panel').scrollIntoView({ block: 'nearest' });
    } else if (action === 'cancel-exit') {
      state.exitPrompt = false; renderQuiz();
    } else if (action === 'repeat-set') {
      startSession(state.entries.map(entry => entry.question), state.reviewRound);
    } else if (action === 'review') {
      startSession(reviewQuestions(state.entries, state.results), true);
    } else if (action === 'repeat-question') {
      stopSpeech(); state.results[state.index] = undefined;
      state.entries[state.index].choices = shuffle(state.entries[state.index].choices);
      renderQuiz(); moveTop();
    } else if (action === 'switch-mode') {
      stopSpeech(); state.mode = state.mode === 'grammar' ? 'listening' : 'grammar';
      state.category = 'すべて'; renderSetup(); moveTop();
    } else if (action === 'play-main') {
      if (state.playing) { stopSpeech(); updateAudioUI('再生を停止しました。'); }
      else { state.playedIds.add(state.entries[state.index].question.id); speak(state.entries[state.index].question.text); }
    } else if (action === 'speak-sentence') {
      const q = state.entries[state.index].question;
      speak(state.mode === 'grammar' ? completedSentence(q) : q.text);
    } else if (action === 'chunk') {
      speak(state.entries[state.index].question.chunks[Number(button.dataset.chunk)].en);
    } else if (action === 'stop-speech') {
      stopSpeech(); updateAudioUI('再生を停止しました。');
    } else if (action === 'speed') {
      state.speed = Number(button.dataset.rate); stopSpeech();
      root.querySelectorAll('[data-action="speed"]').forEach(b => {
        const selected = Number(b.dataset.rate) === state.speed;
        b.classList.toggle('selected', selected); b.setAttribute('aria-pressed', String(selected));
      });
      updateAudioUI('速度を変えました。再生ボタンをタップしてください。');
    } else if (action === 'reveal') {
      state.reveal = !state.reveal;
      document.getElementById('transcript-text').hidden = !state.reveal;
      document.getElementById('phrase-card').hidden = !state.reveal;
      button.textContent = state.reveal ? '英文を隠す' : '英文を表示';
    } else if (action === 'recap-audio') {
      const q = state.entries[Number(button.dataset.index)].question;
      speak(state.mode === 'grammar' ? completedSentence(q) : q.text);
    }
  });

  root.addEventListener('change', event => {
    const setting = event.target.dataset.setting;
    if (setting === 'speed') { state.speed = Number(event.target.value); stopSpeech(); }
    if (setting === 'voice') { state.voiceURI = event.target.value; stopSpeech(); }
    if (setting === 'mark' && state.results[state.index]) state.results[state.index].marked = event.target.checked;
  });
  if (canSpeak()) window.speechSynthesis.addEventListener('voiceschanged', () => {
    root.querySelectorAll('[data-setting="voice"]').forEach(select => { select.innerHTML = voiceOptions(); });
  });
  window.addEventListener('pagehide', stopSpeech);
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopSpeech(); updateAudioUI('再生を停止しました。もう一度聞くには再生ボタンをタップ。'); } });
  renderHome();
})();

</script>
</body>
</html>
